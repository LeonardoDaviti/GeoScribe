<!doctype html>
<html>
<head><meta charset="utf-8"><title>degrade harness</title></head>
<body>
<script src="../js/degrade.js"></script>
<script>
'use strict';

/* same seeded rng as index.html */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* synthetic stand-in for a rendered Georgian line: paper + ink strokes + text */
function testCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h);
  x.strokeStyle = '#101010'; x.lineWidth = 2.5; x.lineCap = 'round';
  const r = mulberry32(7);
  for (let i = 0; i < 26; i++) {
    const bx = 12 + i * ((w - 24) / 26);
    x.beginPath();
    x.moveTo(bx, h * 0.7);
    x.bezierCurveTo(bx + 4, h * (0.25 + r() * 0.2), bx + 12, h * (0.2 + r() * 0.3), bx + 14, h * 0.72);
    x.stroke();
  }
  x.fillStyle = '#0a0a0a';
  x.font = `${Math.round(h * 0.42)}px serif`;
  x.fillText('abcdefg ABCDEFG 12345', 10, h * 0.94);
  return c;
}

function stats(cv) {
  const d = cv.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, cv.width, cv.height).data;
  const n = d.length / 4;
  let sum = 0;
  const lum = new Float32Array(n);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    const l = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
    lum[j] = l; sum += l;
  }
  const mean = sum / n;
  let dark = 0, varsum = 0;
  for (let j = 0; j < n; j++) { if (lum[j] < mean - 20) dark++; varsum += (lum[j] - mean) ** 2; }
  return { mean, std: Math.sqrt(varsum / n), darkFrac: dark / n };
}

function diffFrac(a, b) {
  const da = a.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, a.width, a.height).data;
  const db = b.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, b.width, b.height).data;
  let changed = 0, tot = da.length / 4, sum = 0;
  for (let i = 0; i < da.length; i += 4) {
    const d0 = Math.abs(da[i] - db[i]) + Math.abs(da[i + 1] - db[i + 1]) + Math.abs(da[i + 2] - db[i + 2]);
    if (d0 > 12) changed++;
    sum += d0 / 3;
  }
  return { frac: changed / tot, meanAbs: sum / tot };
}

function bytesOf(cv) { return cv.toDataURL('image/png').length; }

window.T = {
  presets: () => DEGRADE.presetNames,

  /* run one preset; returns measurements + png data url */
  async run(preset, seed, opt) {
    opt = opt || {};
    const src = testCanvas(opt.w || 640, opt.h || 96);
    let cfg = DEGRADE.presets[preset];
    if (opt.noJpeg) { cfg = Object.assign({}, cfg); delete cfg.jpeg; }
    const out = await DEGRADE.apply(src, cfg, mulberry32(seed));
    const d = (out.width === src.width && out.height === src.height) ? diffFrac(src, out) : null;
    return {
      w: out.width, h: out.height, sw: src.width, sh: src.height,
      diff: d, src: stats(src), out: stats(out),
      png: out.toDataURL('image/png'),
      bytes: bytesOf(out),
    };
  },

  /* byte-identical check between two runs with the same seed */
  async determinism(preset, seed, noJpeg) {
    const a = await this.run(preset, seed, { noJpeg });
    const b = await this.run(preset, seed, { noJpeg });
    return { same: a.png === b.png, bytesA: a.bytes, bytesB: b.bytes };
  },

  /* different seeds must produce different images (batch variety) */
  async variety(preset) {
    const a = await this.run(preset, 11, { noJpeg: true });
    const b = await this.run(preset, 999, { noJpeg: true });
    return { same: a.png === b.png };
  },

  /* input canvas must not be mutated */
  async purity(preset) {
    const src = testCanvas(320, 64);
    const before = src.toDataURL('image/png');
    await DEGRADE.apply(src, DEGRADE.presets[preset], mulberry32(3));
    return { untouched: src.toDataURL('image/png') === before };
  },
};
</script>
</body>
</html>
